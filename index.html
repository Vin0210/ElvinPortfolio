    <!-- Inter (body) · JetBrains Mono (labels/code details) · Instrument Serif (display) -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <style>
      /* Pre-hydration paint: set the right theme before React loads
         to avoid a flash + a costly repaint on first paint */
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 96px;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
      }
      html[data-theme='light'] {
        color-scheme: light;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #FAF7F2;
      }
      html[data-theme='dark'] body {
        background-color: #14110E;
      }
    </style>
    <script>
      // Apply the saved theme synchronously before first paint.
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
