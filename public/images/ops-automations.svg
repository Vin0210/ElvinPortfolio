<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <rect width="1200" height="750" rx="16" fill="#FAF7F2"/>
  <rect x="0" y="0" width="1200" height="750" rx="16" fill="none" stroke="#E5DDD2" stroke-width="2"/>
  <text x="80" y="100" font-family="monospace" font-size="24" fill="#8B847A">$ ops-automations — trigger → logic → action</text>
  <!-- nodes -->
  <rect x="80" y="160" width="300" height="180" rx="12" fill="#FFFDF9" stroke="#221D18" stroke-width="2"/>
  <text x="110" y="210" font-family="monospace" font-size="20" fill="#C2410C">TRIGGER</text>
  <text x="110" y="250" font-family="sans-serif" font-size="24" font-weight="bold" fill="#221D18">Form / Cron</text>
  <text x="110" y="285" font-family="monospace" font-size="18" fill="#57514A">contact, MySQL,</text>
  <text x="110" y="310" font-family="monospace" font-size="18" fill="#57514A">booking event</text>
  <rect x="450" y="160" width="300" height="180" rx="12" fill="#221D18"/>
  <text x="480" y="210" font-family="monospace" font-size="20" fill="#FF7A3D">LOGIC / AI</text>
  <text x="480" y="250" font-family="sans-serif" font-size="24" font-weight="bold" fill="#EDE7DE">Classify + check</text>
  <text x="480" y="285" font-family="monospace" font-size="18" fill="#A79F93">Gemini, SQL rules,</text>
  <text x="480" y="310" font-family="monospace" font-size="18" fill="#A79F93">conflict detect</text>
  <rect x="820" y="160" width="300" height="180" rx="12" fill="#C2410C"/>
  <text x="850" y="210" font-family="monospace" font-size="20" fill="#FFF6EC">ACTION</text>
  <text x="850" y="250" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FFF6EC">Email / alert</text>
  <text x="850" y="285" font-family="monospace" font-size="18" fill="#FFF6EC">route, notify,</text>
  <text x="850" y="310" font-family="monospace" font-size="18" fill="#FFF6EC">retry + log</text>
  <!-- arrows -->
  <text x="395" y="260" font-family="monospace" font-size="36" fill="#C2410C">→</text>
  <text x="765" y="260" font-family="monospace" font-size="36" fill="#C2410C">→</text>
  <!-- bottom rows -->
  <rect x="80" y="380" width="1040" height="90" rx="10" fill="#FFFDF9" stroke="#E5DDD2" stroke-width="2"/>
  <text x="110" y="415" font-family="monospace" font-size="19" fill="#57514A">inbox triage — form → classify intent → route + draft reply</text>
  <text x="110" y="445" font-family="monospace" font-size="19" fill="#1B7F4D">→ ~30 min saved per inquiry batch</text>
  <rect x="80" y="490" width="1040" height="90" rx="10" fill="#FFFDF9" stroke="#E5DDD2" stroke-width="2"/>
  <text x="110" y="525" font-family="monospace" font-size="19" fill="#57514A">registrar alerts — MySQL cron → detect clashes → email staff</text>
  <text x="110" y="555" font-family="monospace" font-size="19" fill="#1B7F4D">→ conflicts caught before enrollment day</text>
  <rect x="80" y="600" width="1040" height="90" rx="10" fill="#FFFDF9" stroke="#E5DDD2" stroke-width="2"/>
  <text x="110" y="635" font-family="monospace" font-size="19" fill="#57514A">booking checks — Playwright → book slot → alert on failure</text>
  <text x="110" y="665" font-family="monospace" font-size="19" fill="#1B7F4D">→ broken checkout found in minutes, not days</text>
</svg>
